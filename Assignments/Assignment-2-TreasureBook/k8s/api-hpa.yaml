# Autoscaling: 3 -> 10 pods when average CPU exceeds 5% of the requested 100m (i.e. > 5m CPU per pod).
# Needs the metrics server:  minikube addons enable metrics-server
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: treasurebook-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: treasurebook-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 5
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0       # react to a treasure-hunt surge immediately
      policies:
        - type: Pods
          value: 4
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60      # default is 300 s; shortened so scale-in is visible in a demo
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
